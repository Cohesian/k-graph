# K-graph resolution config.
#
# k-graph/ leaves declare abstract `data` (documents, media.scripts.scenes,
# media.videos). This file defines infrastructure sources and the sources each
# data tree can reach.
#
# Each source declares:
#   origin  — base domain or URL prefix (empty for local filesystem)
#   mapping — path | hash
#   pattern — URL segment when origin is set, or hash URL template (mapping = hash)
#   mapper  — hash-map file (required when mapping = hash); path relative to repo root

[infrastructure.foundations.local]
mapping = "path"
root = "../foundations/data/documents"

[infrastructure.foundations.github]
origin = "https://github.com/Cohesian/foundations/blob/main"
mapping = "path"
root = "data/documents"
pattern = "/{path}"

[infrastructure.studio]
origin = "https://github.com/Cohesian/studio/blob/main"
mapping = "path"
root = "videos/scenes/k_graph"
pattern = "/{path}"

[infrastructure.youtube]
origin = "https://www.youtube.com"
mapping = "hash"
pattern = "/watch?v={hash}"
mapper = "maps/youtube.toml"

# --- data trees: reachable sources ---------------------------------------------

[data.documents]
sources = ["foundations.local", "foundations.github"]
serve = "foundations.local"

[data.media.scripts.scenes]
sources = ["studio"]
serve = "studio"

[data.media.videos]
sources = ["youtube"]
serve = "youtube"
